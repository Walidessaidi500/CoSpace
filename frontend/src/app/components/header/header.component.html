<header class="bg-white border-b border-[rgba(0,0,0,0.05)] fixed w-full top-0 z-50 font-sans">
    <div class="w-full px-8 sm:px-12 lg:px-16">
        <div class="flex justify-between items-center h-20">
            <!-- Logo -->
            <div class="flex-shrink-0 flex items-center gap-3 cursor-pointer" routerLink="/">
                <div
                    class="w-10 h-10 bg-[#0d1b2a] rounded-xl flex items-center justify-center text-white font-semibold text-lg">
                    C
                </div>
                <span class="font-bold text-2xl text-[#0d1b2a] tracking-tight">CoSpace</span>
            </div>

            <!-- Navigation -->
            <nav class="hidden md:flex gap-8 items-center">
                <a routerLink="/"
                    class="text-[#4a5565] hover:text-[#0d1b2a] font-medium transition-colors text-[16px]">Inicio</a>
                <a routerLink="/explorar"
                    class="text-[#4a5565] hover:text-[#0d1b2a] font-medium transition-colors text-[16px]">Coworkings</a>

                <!-- Bloque Condicional: Si hay usuario logueado -->
                <div *ngIf="currentUser$ | async as user; else loginBlock"
                    class="flex items-center gap-4 relative group">
                    <div class="flex items-center gap-3 cursor-pointer">
                        <div
                            class="w-10 h-10 rounded-full bg-[#ff7a00] flex items-center justify-center text-white font-bold shadow-md">
                            {{ user.nombre_completo.charAt(0).toUpperCase() }}
                        </div>
                        <div class="flex flex-col">
                            <span class="text-[14px] font-semibold text-[#0d1b2a] leading-tight">
                                {{ user.nombre_completo }}
                            </span>
                            <span class="text-[12px] text-[#717182]">Conectado</span>
                        </div>
                    </div>

                    <!-- Botón de Salir (Simple por ahora) -->
                    <button (click)="logout()"
                        class="text-[12px] font-medium text-red-500 hover:text-red-700 bg-red-50 px-3 py-1 rounded-full transition-colors ml-2">
                        Salir
                    </button>
                </div>

                <!-- Bloque Else: Botones de Login/Registro -->
                <ng-template #loginBlock>
                    <a routerLink="/iniciar-sesion"
                        class="text-[#4a5565] hover:text-[#0d1b2a] font-medium transition-colors text-[16px]">Iniciar
                        Sesion</a>
                    <a routerLink="/registrar"
                        class="bg-[#ff7a00] hover:bg-[#e66e00] text-white px-6 py-2.5 rounded-full font-medium transition-colors shadow-sm hover:shadow-md text-[14px]">
                        Registrar
                    </a>
                </ng-template>
            </nav>
        </div>
    </div>
</header>
