<div class="bg-white p-10 rounded-2xl shadow-lg w-full max-w-[440px] mx-auto border border-[rgba(0,0,0,0.05)]">
    <div class="text-center mb-10">
        <h2 class="text-[32px] font-semibold text-[#0d1b2a] mb-2 font-['Poppins']">Bienvenido de nuevo</h2>
        <p class="text-[#717182] text-[16px]">Inicia sesión en tu cuenta de CoSpace</p>
    </div>

    <div *ngIf="successMessage" class="mb-4 p-4 bg-green-100 text-green-700 rounded-xl text-center">
        {{ successMessage }}
    </div>
    <div *ngIf="errorMessage" class="mb-4 p-4 bg-red-100 text-red-700 rounded-xl text-center">
        {{ errorMessage }}
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
        <!-- Email Field -->
        <div class="space-y-2">
            <label for="email" class="text-[14px] font-medium text-[#0d1b2a] block">Email</label>
            <input id="email" type="email" formControlName="email" placeholder="tu@email.com"
                class="w-full px-4 py-3 rounded-2xl bg-[#f3f3f5] border-none focus:ring-2 focus:ring-[#ff7a00]/20 outline-none transition-all placeholder-[#717182] text-[#0d1b2a] font-medium"
                [class.ring-2]="form.controls['email'].invalid && form.controls['email'].touched"
                [class.ring-red-500]="form.controls['email'].invalid && form.controls['email'].touched">
            <div *ngIf="form.controls['email'].invalid && form.controls['email'].touched"
                class="text-red-500 text-xs mt-1">
                <span *ngIf="form.controls['email'].hasError('required')">El email es obligatorio.</span>
                <span *ngIf="form.controls['email'].hasError('email')">Introduce un email válido.</span>
            </div>
        </div>

        <!-- Password Field -->
        <div class="space-y-2">
            <label for="password" class="text-[14px] font-medium text-[#0d1b2a] block">Contraseña</label>
            <input id="password" type="password" formControlName="password" placeholder="........"
                class="w-full px-4 py-3 rounded-2xl bg-[#f3f3f5] border-none focus:ring-2 focus:ring-[#ff7a00]/20 outline-none transition-all placeholder-[#717182] text-[#0d1b2a] font-medium"
                [class.ring-2]="form.controls['password'].invalid && form.controls['password'].touched"
                [class.ring-red-500]="form.controls['password'].invalid && form.controls['password'].touched">
            <div *ngIf="form.controls['password'].invalid && form.controls['password'].touched"
                class="text-red-500 text-xs mt-1">
                <span *ngIf="form.controls['password'].hasError('required')">La contraseña es obligatoria.</span>
            </div>
        </div>

        <!-- Submit Button -->
        <button type="button" (click)="onSubmit()"
            class="w-full py-3.5 px-6 bg-[#ff7a00] hover:bg-[#e66e00] text-white rounded-full font-medium shadow-md hover:shadow-lg transform active:scale-[0.98] transition-all duration-200 mt-2">
            Iniciar sesión
        </button>
    </form>

    <div class="mt-8 text-center text-[14px] text-[#4a5565]">
        ¿No tienes una cuenta?
        <a routerLink="/registrar" class="text-[#ff7a00] font-medium hover:text-[#e66e00] transition-colors">
            Regístrate
        </a>
    </div>
    <div class="mt-8 text-center text-[14px] text-[#4a5565]">
        ¿Has olvidado tu contraseña?
        <a routerLink="/recuperar-password" class="text-[#ff7a00] font-medium hover:text-[#e66e00] transition-colors">
            Recuperar contraseña
        </a>
    </div>
</div>
