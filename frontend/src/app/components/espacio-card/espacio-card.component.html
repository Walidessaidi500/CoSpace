<div
  class="bg-white dark:bg-[#1a2736] rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-hidden hover:shadow-lg transition-all duration-300 group">
  <div class="relative h-52 overflow-hidden">
    <img [src]="getImagenPrincipal()" [alt]="espacio.titulo"
      class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">
  </div>

  <div class="p-5">
    <h3 class="text-xl font-bold text-slate-900 dark:text-white mb-1 truncate">{{ espacio.titulo }}</h3>

    <div class="flex items-center text-gray-500 dark:text-gray-400 text-sm mb-4">
      <svg class="w-4 h-4 mr-1 text-gray-400 dark:text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
      </svg>
      {{ espacio.direccion }}
    </div>

    <div class="flex justify-between items-center mb-6">
      <div class="flex items-center bg-orange-50 dark:bg-orange-900/20 px-2 py-1 rounded-lg gap-1">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-orange-500 dark:text-orange-400 mr-1"
          fill="currentColor" viewBox="0 0 20 20">
          <path
            d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z">
          </path>
        </svg>
        <span class="font-bold text-orange-700 dark:text-orange-300 text-sm">{{ espacio.rating_promedio }}</span>
        <span class="text-gray-400 dark:text-gray-500 text-xs font-normal">({{ espacio.total_resenas || 0 }})</span>
      </div>
      <div class="text-slate-900 dark:text-white">
        <span class="font-black text-xl">{{ espacio.precio_hora }}€</span>
        <span class="text-gray-400 font-normal">{{ 'EXPLORE.CARD.PER_HOUR' | translate }}</span>
      </div>
    </div>

    <button [routerLink]="['/espacios', espacio.id_espacio]"
      class="w-full bg-[#0f172a] dark:bg-white text-white dark:text-[#0f172a] py-3 rounded-xl font-semibold hover:bg-slate-800 dark:hover:bg-gray-100 transform active:scale-95 transition-all">
      {{ 'EXPLORE.CARD.DETAILS_BTN' | translate }}
    </button>
  </div>
</div>
