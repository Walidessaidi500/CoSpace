<!-- Header is now in app.component.html -->

<div
  class="min-h-screen bg-[#f4f4f6] dark:bg-[#0d1b2a] flex justify-center items-center py-12 px-4 transition-colors duration-300">

  <div
    class="bg-white dark:bg-[#1a2736] p-8 md:p-10 rounded-2xl shadow-xl w-full max-w-3xl border border-transparent dark:border-gray-700 transition-colors duration-300">

    <h1 class="text-3xl font-bold text-center text-slate-900 dark:text-white mb-2">Crear Cuenta de Anfitrión</h1>
    <p class="text-gray-500 dark:text-gray-400 text-center mb-8">Anuncia tu espacio de coworking en CoSpace.</p>

    <form [formGroup]="registroForm" (ngSubmit)="onSubmit()">

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-5">

        <div>
          <label class="block text-sm font-bold text-slate-700 dark:text-gray-300 mb-2">Nombre Completo</label>
          <input type="text" formControlName="nombre_completo" placeholder="Jose Juan"
            class="w-full bg-gray-100 dark:bg-gray-700/50 border border-transparent dark:border-gray-600 rounded-lg px-4 py-3 text-gray-700 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:bg-white dark:focus:bg-gray-700 focus:border-gray-300 dark:focus:border-gray-500 transition">
        </div>

        <div>
          <label class="block text-sm font-bold text-slate-700 dark:text-gray-300 mb-2">Email</label>
          <input type="email" formControlName="email" placeholder="josejuan@email.com"
            class="w-full bg-gray-100 dark:bg-gray-700/50 border border-transparent dark:border-gray-600 rounded-lg px-4 py-3 text-gray-700 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:bg-white dark:focus:bg-gray-700 focus:border-gray-300 dark:focus:border-gray-500 transition">
        </div>

        <div>
          <label class="block text-sm font-bold text-slate-700 dark:text-gray-300 mb-2">Contraseña</label>
          <input type="password" formControlName="password" placeholder="........."
            class="w-full bg-gray-100 dark:bg-gray-700/50 border border-transparent dark:border-gray-600 rounded-lg px-4 py-3 text-gray-700 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:bg-white dark:focus:bg-gray-700 focus:border-gray-300 dark:focus:border-gray-500 transition">
        </div>

        <div>
          <label class="block text-sm font-bold text-slate-700 dark:text-gray-300 mb-2">Confirma Contraseña</label>
          <input type="password" formControlName="password_confirmation" placeholder="........."
            class="w-full bg-gray-100 dark:bg-gray-700/50 border border-transparent dark:border-gray-600 rounded-lg px-4 py-3 text-gray-700 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:bg-white dark:focus:bg-gray-700 focus:border-gray-300 dark:focus:border-gray-500 transition">
          <p *ngIf="registroForm.errors?.['mismatch'] && registroForm.touched" class="text-red-500 text-xs mt-1">
            Las contraseñas no coinciden
          </p>
        </div>
      </div>

      <div class="space-y-5">
        <div>
          <label class="block text-sm font-bold text-slate-700 dark:text-gray-300 mb-2">Nombre Espacio de
            Trabajo</label>
          <input type="text" formControlName="titulo" placeholder="Mi Espacio de Trabajo"
            class="w-full bg-gray-100 dark:bg-gray-700/50 border border-transparent dark:border-gray-600 rounded-lg px-4 py-3 text-gray-700 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:bg-white dark:focus:bg-gray-700 focus:border-gray-300 dark:focus:border-gray-500 transition">
        </div>

        <div>
          <label class="block text-sm font-bold text-slate-700 dark:text-gray-300 mb-2">Dirección</label>
          <input #addressInput type="text" formControlName="direccion"
            placeholder="Calle Juan Ramon, 12, planta 3, Sagunto, Valencia"
            class="w-full bg-gray-100 dark:bg-gray-700/50 border border-transparent dark:border-gray-600 rounded-lg px-4 py-3 text-gray-700 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:bg-white dark:focus:bg-gray-700 focus:border-gray-300 dark:focus:border-gray-500 transition">
        </div>

        <div>
          <label class="block text-sm font-bold text-slate-700 dark:text-gray-300 mb-2">Ciudad</label>
          <input type="text" formControlName="ciudad" placeholder="Valencia"
            class="w-full bg-gray-100 dark:bg-gray-700/50 border border-transparent dark:border-gray-600 rounded-lg px-4 py-3 text-gray-700 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:bg-white dark:focus:bg-gray-700 focus:border-gray-300 dark:focus:border-gray-500 transition">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-bold text-slate-700 dark:text-gray-300 mb-2">Capacidad (Personas)</label>
            <input type="number" formControlName="capacidad" min="1" placeholder="Ej. 10"
              class="w-full bg-gray-100 dark:bg-gray-700/50 border border-transparent dark:border-gray-600 rounded-lg px-4 py-3 text-gray-700 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:bg-white dark:focus:bg-gray-700 focus:border-gray-300 dark:focus:border-gray-500 transition">
          </div>

          <div>
            <label class="block text-sm font-bold text-slate-700 dark:text-gray-300 mb-2">Precio por Hora (€)</label>
            <input type="number" formControlName="precio_hora" min="0" step="0.01" placeholder="Ej. 15.50"
              class="w-full bg-gray-100 dark:bg-gray-700/50 border border-transparent dark:border-gray-600 rounded-lg px-4 py-3 text-gray-700 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:bg-white dark:focus:bg-gray-700 focus:border-gray-300 dark:focus:border-gray-500 transition">
          </div>
        </div>

        <div>
          <label class="block text-sm font-bold text-slate-700 dark:text-gray-300 mb-2">Corta Descripción</label>
          <textarea formControlName="descripcion" rows="4" placeholder="Describe tu espacio de trabajo"
            class="w-full bg-gray-100 dark:bg-gray-700/50 border border-transparent dark:border-gray-600 rounded-lg px-4 py-3 text-gray-700 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:bg-white dark:focus:bg-gray-700 focus:border-gray-300 dark:focus:border-gray-500 transition resize-none"></textarea>
        </div>
      </div>

      <button type="submit" [disabled]="registroForm.invalid || loading"
        class="w-full mt-8 bg-orange-500 hover:bg-orange-600 disabled:bg-orange-300 dark:disabled:bg-orange-500/50 text-white font-bold py-4 rounded-full transition duration-300 shadow-lg transform active:scale-[0.99]">
        {{ loading ? 'Creando...' : 'Crear Cuenta de Anfitrión' }}
      </button>

      <p *ngIf="errorMessage" class="text-red-500 text-center mt-4 font-medium">{{ errorMessage }}</p>

    </form>

    <div class="mt-8 text-center space-y-2 text-gray-600 dark:text-gray-400">
      <p>¿Ya tienes una cuenta? <a routerLink="/iniciar-sesion"
          class="text-orange-500 font-bold hover:underline">Iniciar
          Sesión</a></p>
      <p>¿Buscando un espacio? <a routerLink="/registro-cliente"
          class="text-orange-500 font-bold hover:underline">Registrarse como
          Cliente</a></p>
    </div>

  </div>
</div>
