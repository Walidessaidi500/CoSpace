<div
    class="min-h-screen bg-[#f4f4f6] dark:bg-[#0d1b2a] flex justify-center items-center py-12 px-4 transition-colors duration-300">
    <div
        class="bg-white dark:bg-[#1a2736] p-8 md:p-10 rounded-2xl shadow-xl w-full max-w-md border border-transparent dark:border-gray-700 transition-colors duration-300">
        <h2 class="text-3xl font-bold text-center text-slate-900 dark:text-white mb-2">Nueva Contraseña</h2>
        <p class="text-gray-500 dark:text-gray-400 text-center mb-8">
            Introduce el código, tu email y tu nueva contraseña.
        </p>

        <div *ngIf="message"
            class="mb-4 p-4 bg-green-100 dark:bg-green-900/30 text-green-700 dark:text-green-300 rounded-xl text-center">
            {{ message }}
        </div>

        <div *ngIf="errorMessage"
            class="mb-4 p-4 bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-300 rounded-xl text-center">
            {{ errorMessage }}
        </div>

        <form (ngSubmit)="submit()">
            <div class="space-y-6">
                <div>
                    <label class="block text-sm font-bold text-slate-700 dark:text-gray-300 mb-2">Email</label>
                    <input type="email" [(ngModel)]="email" name="email" placeholder="tu@email.com" required
                        class="w-full bg-gray-100 dark:bg-gray-700/50 border border-transparent dark:border-gray-600 rounded-lg px-4 py-3 text-gray-700 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:bg-white dark:focus:bg-gray-700 focus:border-orange-500 dark:focus:border-orange-500 transition">
                </div>

                <div>
                    <label class="block text-sm font-bold text-slate-700 dark:text-gray-300 mb-2">Código de
                        Verificación</label>
                    <input type="text" [(ngModel)]="code" name="code" placeholder="123456" required
                        class="w-full bg-gray-100 dark:bg-gray-700/50 border border-transparent dark:border-gray-600 rounded-lg px-4 py-3 text-gray-700 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:bg-white dark:focus:bg-gray-700 focus:border-orange-500 dark:focus:border-orange-500 transition">
                </div>

                <div>
                    <label class="block text-sm font-bold text-slate-700 dark:text-gray-300 mb-2">Nueva
                        Contraseña</label>
                    <input type="password" [(ngModel)]="password" name="password" placeholder="Min. 8 caracteres"
                        required
                        class="w-full bg-gray-100 dark:bg-gray-700/50 border border-transparent dark:border-gray-600 rounded-lg px-4 py-3 text-gray-700 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:bg-white dark:focus:bg-gray-700 focus:border-orange-500 dark:focus:border-orange-500 transition">
                </div>

                <div>
                    <label class="block text-sm font-bold text-slate-700 dark:text-gray-300 mb-2">Confirmar
                        Contraseña</label>
                    <input type="password" [(ngModel)]="password_confirmation" name="password_confirmation"
                        placeholder="Repite la contraseña" required
                        class="w-full bg-gray-100 dark:bg-gray-700/50 border border-transparent dark:border-gray-600 rounded-lg px-4 py-3 text-gray-700 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:bg-white dark:focus:bg-gray-700 focus:border-orange-500 dark:focus:border-orange-500 transition">
                </div>

                <button type="submit" [disabled]="isLoading || !email || !code || !password"
                    class="w-full bg-orange-500 hover:bg-orange-600 disabled:bg-orange-300 dark:disabled:bg-orange-500/50 text-white font-bold py-4 rounded-full transition duration-300 shadow-lg transform active:scale-[0.99]">
                    {{ isLoading ? 'Restableciendo...' : 'Restablecer Contraseña' }}
                </button>
            </div>
        </form>
    </div>
</div>
