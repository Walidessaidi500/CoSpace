<div class="min-h-screen bg-slate-50/50">

  <main class="max-w-7xl mx-auto px-6 py-12">
    <h1 class="text-4xl md:text-5xl font-extrabold text-slate-900 mb-10">
      Explorar Espacios de Coworking
    </h1>

    <div *ngIf="errorMessage" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-6"
      role="alert">
      <strong class="font-bold">Error!</strong>
      <span class="block sm:inline">{{ errorMessage }}</span>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-12">
      <div class="relative">
        <input type="text" [(ngModel)]="filtroCiudad" (input)="filtrarEspacios()" placeholder="Buscar ciudad..."
          class="w-full bg-white border border-gray-200 rounded-xl p-4 text-gray-500 focus:outline-none focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 transition-all">
        <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-gray-400">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </div>
      </div>

      <div class="relative">
        <select [(ngModel)]="filtroPrecio" (change)="filtrarEspacios()"
          class="w-full appearance-none bg-white border border-gray-200 rounded-xl p-4 text-gray-500 focus:outline-none focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 transition-all">
          <option value="">Todos los precios</option>
          <option value="0-20">Menos de 20€/h</option>
          <option value="20-50">20€ - 50€/h</option>
          <option value="50+">Más de 50€/h</option>
        </select>
        <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-gray-400">▼</div>
      </div>

      <div class="relative">
        <select [(ngModel)]="filtroEstado" (change)="filtrarEspacios()"
          class="w-full appearance-none bg-white border border-gray-200 rounded-xl p-4 text-gray-500 focus:outline-none focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 transition-all">
          <option value="">Todos los estados</option>
          <option value="Disponible">Disponible</option>
          <option value="Mantenimiento">En Mantenimiento</option>
        </select>
        <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-gray-400">▼</div>
      </div>

      <div class="relative">
        <select [(ngModel)]="filtroRating" (change)="filtrarEspacios()"
          class="w-full appearance-none bg-white border border-gray-200 rounded-xl p-4 text-gray-500 focus:outline-none focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 transition-all">
          <option value="">Todas las valoraciones</option>
          <option value="5">5 estrellas</option>
          <option value="4">4 estrellas o más</option>
          <option value="3">3 estrellas o más</option>
          <option value="2">2 estrellas o más</option>
          <option value="1">1 estrella o más</option>
        </select>
        <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-gray-400">▼</div>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      <app-espacio-card *ngFor="let item of listaEspacios" [espacio]="item">
      </app-espacio-card>
    </div>

    <div *ngIf="isLoading" class="text-center py-20">
      <p class="text-gray-400 text-lg">Cargando espacios increíbles para ti...</p>
    </div>

    <div *ngIf="!isLoading && listaEspacios.length === 0 && !errorMessage" class="text-center py-20">
      <p class="text-gray-400 text-lg">No se encontraron espacios disponibles en este momento.</p>
    </div>
  </main>
</div>
